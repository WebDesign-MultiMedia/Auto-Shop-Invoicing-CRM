name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (demo mode, placeholder values - no real secrets)
        run: npm run build
        env:
          DEMO_MODE: "true"
          SESSION_SECRET: ci-placeholder-session-secret-not-a-real-value-0000
          INVOICE_SHARE_SECRET: ci-placeholder-share-secret-not-a-real-value-0000
          STAFF_ACCOUNTS: "{}"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependency audit
        run: npm audit --audit-level=high
